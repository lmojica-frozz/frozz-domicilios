name: App Android (APK)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Preparar archivo
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk salida/frozz-domiciliarios.apk
          ls -la salida

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Frozz Domiciliarios 1.0.${{ github.run_number }}
          body: |
            App de domiciliarios de Frozz Colombia.
            Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/frozz-domiciliarios.apk
          files: salida/frozz-domiciliarios.apk
          make_latest: "true"
